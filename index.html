<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<meta name="description" content="TIC MASTER — plateforme éducative TIC francophone. Accès direct à l'application.">
<meta http-equiv="refresh" content="4; url=https://simon-anymore-cape-buttons.trycloudflare.com">
<title>TIC MASTER — Accès à la plateforme</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    min-height:100%;display:grid;place-items:center;padding:24px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:#071426;color:#f1f5f9;
    background-image:
      radial-gradient(circle at 18% 12%,rgba(37,99,235,.35),transparent 42%),
      radial-gradient(circle at 82% 8%,rgba(34,211,238,.22),transparent 38%);
  }
  .card{width:min(560px,100%);text-align:center;padding:38px 30px;border-radius:24px;
    border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);backdrop-filter:blur(10px);
    box-shadow:0 25px 70px rgba(0,0,0,.45)}
  .logo{width:70px;height:70px;margin:0 auto 20px;border-radius:20px;display:grid;place-items:center;
    font-weight:900;font-size:26px;letter-spacing:-1px;color:#fff;
    background:linear-gradient(135deg,#2563eb,#22d3ee);box-shadow:0 12px 30px rgba(37,99,235,.4)}
  h1{margin:0 0 6px;font-size:30px;letter-spacing:-.8px}
  .tagline{margin:0 0 24px;color:#94a3b8;font-size:15px}
  .spinner{width:34px;height:34px;margin:0 auto 18px;border-radius:50%;
    border:3px solid rgba(255,255,255,.15);border-top-color:#22d3ee;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{color:#cbd5e1;line-height:1.6;font-size:14px;margin:0 0 18px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
    padding:14px 26px;border-radius:14px;background:#2563eb;color:#fff;font-weight:700;
    text-decoration:none;font-size:15px;transition:.2s;box-shadow:0 10px 26px rgba(37,99,235,.35)}
  .btn:hover{background:#1d4ed8;transform:translateY(-1px)}
  .btn:focus-visible{outline:3px solid #22d3ee;outline-offset:3px}
  .hint{margin-top:20px;font-size:12px;color:#64748b;word-break:break-all}
  code{color:#67e8f9;background:rgba(34,211,238,.08);padding:2px 6px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true">TM</div>
  <h1>TIC MASTER</h1>
  <p class="tagline">Apprendre les TIC, pas à pas.</p>
  <div class="spinner" role="status" aria-label="Chargement"></div>
  <p>Ouverture de votre plateforme en cours…<br>Si rien ne se passe, utilisez le bouton ci-dessous.</p>
  <a class="btn" id="go" href="https://simon-anymore-cape-buttons.trycloudflare.com">Ouvrir TIC MASTER →</a>
  <p class="hint">Adresse de l’application :<br><code id="target">https://simon-anymore-cape-buttons.trycloudflare.com</code></p>
</main>
<script>
(function(){
  var FALLBACK="https://simon-anymore-cape-buttons.trycloudflare.com";
  function open(url){
    if(!url) return;
    url=String(url).trim();
    if(!/^https:\/\//i.test(url)) return;   // HTTPS uniquement
    document.getElementById('go').href=url;
    document.getElementById('target').textContent=url;
    window.location.replace(url);            // navigation pleine page = cookies conservés
  }
  fetch('redirect.json?ts='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.ok?r.json():Promise.reject()})
    .then(function(c){open(c.url||FALLBACK)})
    .catch(function(){open(FALLBACK)});
  setTimeout(function(){open(FALLBACK)},3500);
})();
</script>
</body>
</html>
